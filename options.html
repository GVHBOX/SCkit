<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<title data-i18n="title_opts">SCKit 设置</title>
<style>
  :root{
    --bg:#101114; --panel:#191b1f; --panel2:#1f2227; --line:#000; --track:#31343b;
    --tx:#f2f3f5; --muted:#9aa0a8; --accent:#ff5500;
    --tiltn:15;
  }
  body.light{
    --bg:#f5f6f8; --panel:#fff; --panel2:#eceef1; --track:#d5d8dd;
    --tx:#16181c; --muted:#6b7078;
  }
  *,*::before,*::after{box-sizing:border-box}
  body{
    margin:0; padding:0 16px 40px; background:var(--bg); color:var(--tx);
    font:15px/1.7 "Segoe UI",system-ui,"Microsoft YaHei",sans-serif;
  }
  .wrap{max-width:980px;margin:0 auto}
  .cols{display:flex;gap:18px;align-items:flex-start}
  .col{flex:1;min-width:0}
  @media (max-width:760px){.cols{flex-direction:column}}
  header{display:flex;align-items:center;gap:14px;padding:28px 0 6px}
  header .logo{flex:0 0 auto;filter:drop-shadow(0 4px 0 rgba(0,0,0,.55))}
  header h1{font-size:20px;margin:0;letter-spacing:.5px}
  header .sel{margin-left:auto}
  .card{
    background:var(--panel);border:3px solid var(--line);border-radius:16px;
    box-shadow:0 6px 0 rgba(0,0,0,.55);padding:6px 18px 14px;margin:18px 0;
  }
  .card>h2{
    font-size:12px;font-weight:700;letter-spacing:2px;color:var(--accent);
    margin:12px 0 4px;text-transform:uppercase;
  }
  .card>h2.keyhead{display:flex;align-items:center;justify-content:space-between}
  .card>h2.keyhead .colhint{letter-spacing:2px}
  .row{display:flex;align-items:center;gap:14px;padding:10px 0;border-bottom:1px dashed #2a2d33}
  .row:last-child{border-bottom:none}
  .row .info{flex:1;min-width:0}
  .row .info b{display:block;font-size:14.5px}
  .keycap{
    width:58px;height:58px;text-align:center;font:700 22px/1 Consolas,monospace;
    color:#16181c;background:#f6f7f8;border:3px solid var(--line);border-radius:12px;
    box-shadow:0 5px 0 var(--line);outline:none;text-transform:uppercase;
    transition:transform .06s,box-shadow .06s;
  }
  .keycap:focus{transform:translateY(3px);box-shadow:0 2px 0 var(--line);background:#fff}
  .keycap.dup{border-color:#d93025;box-shadow:0 5px 0 #7a1712;background:#fdeceb}
  .numcap{
    width:86px;height:58px;text-align:center;font:700 20px/1 Consolas,monospace;
    color:#16181c;background:#f6f7f8;border:3px solid var(--line);border-radius:12px;
    box-shadow:0 5px 0 var(--line);outline:none;transition:transform .06s,box-shadow .06s;
  }
  .numcap:focus{transform:translateY(3px);box-shadow:0 2px 0 var(--line);background:#fff}
  .suffix{font-size:12px;color:var(--muted);margin-left:-6px}
  .sel,.cw{
    background:#f6f7f8;color:#16181c;border:3px solid var(--line);border-radius:10px;
    box-shadow:0 3px 0 var(--line);padding:9px 10px;outline:none;cursor:pointer;
    font-family:inherit;font-size:13px;font-weight:700;line-height:1;
  }
  .cf{
    width:90px;text-align:center;color:#16181c;background:#f6f7f8;
    border:3px solid var(--line);border-radius:10px;box-shadow:0 3px 0 var(--line);
    padding:9px 6px;outline:none;font:700 14px/1 Consolas,monospace;
  }
  .crow{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px dashed #2a2d33}
  .crow:last-child{border-bottom:none}
  .clab{flex:1;font-size:13.5px;font-weight:700}
  .pv{
    width:36px;height:36px;flex:0 0 auto;position:relative;padding:0;cursor:pointer;
    border:3px solid var(--line);border-radius:10px;background:var(--panel2);color:var(--tx);
    box-shadow:0 3px 0 var(--line);transition:transform .06s,box-shadow .06s,background .15s;
    font-family:inherit;font-size:12px;font-weight:700;line-height:1;
  }
  .pv:hover{background:#2a2e35;transform:rotate(calc(var(--tiltn) * -1 * 1deg))}
  .pv:active{transform:translateY(3px);box-shadow:0 0 0 var(--line)}
  .kx{
    width:34px;height:34px;flex:0 0 auto;position:relative;padding:0;cursor:pointer;
    border:3px solid var(--line);border-radius:10px;background:#f6f7f8;
    box-shadow:0 3px 0 var(--line);outline:none;
    transition:transform .06s,box-shadow .06s,background .15s;
  }
  .kx:hover{transform:rotate(calc(var(--tiltn) * -1.05 * 1deg))}
  .kx:active{transform:translateY(3px);box-shadow:0 0 0 var(--line)}
  .kx.off{background:#7a8089}
  .sws{display:flex;gap:6px;flex:0 0 auto}
  .sw{width:34px;height:34px;padding:0;cursor:pointer;flex:0 0 auto;
    border:3px solid var(--line);border-radius:10px;
    box-shadow:0 3px 0 var(--line);transition:transform .06s,box-shadow .06s;outline:none}
  .sw.swwhite{background:#fff}
  .sw.sworange{background:var(--accent)}
  .sw.sel{transform:translateY(3px);box-shadow:0 1px 0 var(--line)}
  .sw:active{transform:translateY(3px);box-shadow:0 1px 0 var(--line)}
  .row.off .info b{color:var(--muted)}
  .row.off .keycap,.row.off .numcap,.row.off .gkey{background:#3a3e46;color:#9aa0a8}
  .gkey{
    min-width:58px;height:40px;display:inline-flex;align-items:center;justify-content:center;
    padding:0 12px;font:700 14px/1 Consolas,monospace;color:#16181c;background:#f6f7f8;
    border:3px solid var(--line);border-radius:12px;
    box-shadow:0 3px 0 var(--line);white-space:nowrap;
  }
  .btnbar{display:flex;align-items:center;gap:12px;margin:20px 0 4px}
  button{
    border:3px solid var(--line);border-radius:12px;cursor:pointer;position:relative;
    font-family:inherit;font-size:15px;font-weight:700;line-height:1;
    padding:13px 26px;color:#fff;
    transition:transform .06s,box-shadow .06s;
  }
  #save{background:#f6f7f8;color:#16181c;box-shadow:0 5px 0 var(--line)}
  #save:hover{background:#fff;transform:rotate(calc(var(--tiltn) * -0.55 * 1deg))}
  #save:active,#reset:active{transform:translateY(4px)}
  #save:active{box-shadow:0 1px 0 var(--line)}
  #reset{background:var(--panel2);color:var(--tx);box-shadow:0 5px 0 var(--line);padding:13px 18px}
  #reset:hover{background:#2a2e35;transform:rotate(calc(var(--tiltn) * -0.55 * 1deg))}
  #reset:active{box-shadow:0 1px 0 var(--line)}
  @keyframes btnFx{from{opacity:1;box-shadow:0 0 0 3px rgba(255,85,0,.65)}to{opacity:0;box-shadow:0 0 0 12px rgba(255,85,0,0)}}
  button.fx::after{content:"";position:absolute;inset:-1px;border-radius:inherit;pointer-events:none;animation:btnFx .35s ease-out forwards}
  .switch{position:relative;display:inline-block;flex:0 0 auto;width:56px;height:30px}
  .switch input{opacity:0;width:0;height:0}
  .switch .track{
    position:absolute;inset:0;background:#3a3e46;border:3px solid var(--line);
    border-radius:999px;box-shadow:0 4px 0 rgba(0,0,0,.55);transition:background .15s;
  }
  .switch .track::before{
    content:"";position:absolute;left:2px;top:2px;width:20px;height:20px;border-radius:50%;
    background:#f6f7f8;border:2px solid var(--line);transition:transform .15s;
  }
  .switch input:checked + .track{background:var(--accent)}
  .switch input:checked + .track::before{transform:translateX(26px)}
  .switch input:focus-visible + .track{outline:2px solid var(--accent);outline-offset:2px}
  input[type=range].vol{-webkit-appearance:none;appearance:none;width:150px;height:26px;
    background:transparent;cursor:pointer;margin:0}
  input[type=range].vol::-webkit-slider-runnable-track{height:12px;border-radius:7px;border:2px solid #000;
    background:linear-gradient(to right,var(--accent) var(--fill,0%),var(--track) var(--fill,0%))}
  input[type=range].vol::-webkit-slider-thumb{-webkit-appearance:none;appearance:none;width:20px;height:20px;
    border-radius:50%;background:#fff;border:3px solid #000;margin-top:-7px;box-shadow:0 2px 0 #000}
  .stage{
    position:relative;height:120px;background:
      radial-gradient(circle at 1px 1px,#26292f 1px,transparent 1.5px) 0 0/18px 18px,
      var(--panel2);
    border:3px solid var(--line);border-radius:16px;box-shadow:0 6px 0 rgba(0,0,0,.55);
    display:flex;align-items:center;justify-content:center;gap:12px;margin:18px 0 10px;
    overflow:hidden;cursor:pointer;
  }
  .stage .tag{position:absolute;left:10px;top:8px;font-size:11px;color:var(--muted);letter-spacing:1px}
  #stage.posL{justify-content:flex-start;padding-left:14px}
  #stage.posC{justify-content:center}
  #stage.posR{justify-content:flex-end;padding-right:14px}
  .sckit-toast{
    position:relative;display:flex;flex-direction:column;align-items:center;
    gap:calc(5px * var(--sckit-s,1));
    background:#17181c;border:calc(2px * var(--sckit-s,1)) solid #000;
    border-radius:calc(14px * var(--sckit-s,1));
    box-shadow:0 calc(4px * var(--sckit-s,1)) 0 rgba(0,0,0,.45);
    padding:calc(11px * var(--sckit-s,1)) calc(15px * var(--sckit-s,1)) calc(9px * var(--sckit-s,1));
    font:700 calc(12.5px * var(--sckit-s,1))/1.3 system-ui,sans-serif;color:#e8eaed;pointer-events:none;
  }
  .sckit-toast .sckit-key{
    display:flex;align-items:center;justify-content:center;
    min-width:calc(42px * var(--sckit-s,1));height:calc(42px * var(--sckit-s,1));padding:0 calc(9px * var(--sckit-s,1));
    background:var(--accent);border:calc(3px * var(--sckit-s,1)) solid #000;border-radius:calc(10px * var(--sckit-s,1));
    box-shadow:0 calc(4px * var(--sckit-s,1)) 0 #000;font:800 calc(19px * var(--sckit-s,1))/1 Consolas,monospace;color:#fff;
  }
  .sckit-toast .sckit-icon{font:400 calc(17px * var(--sckit-s,1))/1 system-ui,"Segoe UI Emoji",sans-serif}
  .sckit-toast .sckit-txt{letter-spacing:.5px}
  @keyframes toastIn{from{opacity:0;transform:translateY(10px) scale(.85)}to{opacity:1;transform:none}}
  .stage.play .sckit-toast{animation:toastIn .18s ease-out both}
  .prow{display:flex;gap:12px;margin:14px 0 4px}
  .pvbox{flex:1;position:relative;border:3px solid var(--line);border-radius:14px;box-shadow:0 4px 0 rgba(0,0,0,.55);
    background:radial-gradient(circle at 1px 1px,#26292f 1px,transparent 1.5px) 0 0/14px 14px,var(--panel2);
    min-height:150px;display:flex;align-items:center;justify-content:center;padding:20px;overflow:hidden}
  body.light .pvbox{background:radial-gradient(circle at 1px 1px,#c9cdd4 1px,transparent 1.5px) 0 0/14px 14px,var(--panel2)}
  .pvbox .ptag{position:absolute;left:10px;top:6px;font-size:11px;color:var(--muted);letter-spacing:1px}
  .pvbox>div{width:100%;display:flex;align-items:center;justify-content:center}
  .pv-slider{position:relative;width:92%;height:16px;border:2px solid #000;border-radius:7px;background:#3a3e46;box-shadow:0 2px 0 rgba(0,0,0,.55)}
  .pv-slider i{position:absolute;top:0;bottom:0;left:0;width:40%;background:var(--accent);border-radius:5px;font-style:normal}
  .pv-slider b{position:absolute;top:50%;left:40%;width:22px;height:22px;margin:-11px 0 0 -11px;
    background:#fff;border:3px solid #000;border-radius:50%;box-sizing:border-box;z-index:1}
  .pv-slider.white i{background:#fff}
  .pv-slider.pv-white{height:30px;border:3px solid #000;border-radius:10px;box-shadow:0 3px 0 rgba(0,0,0,.55)}
  .pv-wave{display:flex;align-items:flex-end;gap:2px;width:92%;height:40px}
  .pv-wave span{flex:1;background:#3a3e46;border-radius:1px}
  .pv-wave span.on{background:var(--accent)}
  .pv-wave.white span.on{background:var(--tx)}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <img class="logo" src="icons/icon128.png" width="52" height="52" alt="SCKit">
    <h1>SCKit</h1>
    <button class="pv" id="btnTheme" data-i18n-title="theme_title" title="切换浅色 / 暗色">☀️</button>
    <select class="sel" id="lang" data-i18n-title="lang_label" title="语言">
      <option value="zh">中文</option>
      <option value="en">English</option>
    </select>
  </header>
  <div class="cols">
  <div class="col">
  <div class="card">
    <h2 class="keyhead"><span data-i18n="sec_keys">快捷键</span><span class="colhint" data-i18n="sec_switch">开关</span></h2>
    <div class="row">
      <div class="info"><b data-i18n="act_next">下一首</b></div>
      <input class="keycap" id="nextKey" maxlength="1" spellcheck="false">
      <button class="kx" id="off_next" type="button"></button>
    </div>
    <div class="row">
      <div class="info"><b data-i18n="act_prev">上一首</b></div>
      <input class="keycap" id="prevKey" maxlength="1" spellcheck="false">
      <button class="kx" id="off_prev" type="button"></button>
    </div>
    <div class="row">
      <div class="info"><b data-i18n="act_ff">快进</b></div>
      <input class="keycap" id="ffKey" maxlength="1" spellcheck="false">
      <input class="numcap" id="ffSeconds" type="number" min="1"><span class="suffix" data-i18n="sec_suffix">秒</span>
      <button class="kx" id="off_ff" type="button"></button>
    </div>
    <div class="row">
      <div class="info"><b data-i18n="act_rw">快退</b></div>
      <input class="keycap" id="rwKey" maxlength="1" spellcheck="false">
      <input class="numcap" id="rwSeconds" type="number" min="1"><span class="suffix" data-i18n="sec_suffix">秒</span>
      <button class="kx" id="off_rw" type="button"></button>
    </div>
    <div class="row">
      <div class="info"><b data-i18n="act_like">喜欢</b></div>
      <input class="keycap" id="likeKey" maxlength="1" spellcheck="false">
      <button class="kx" id="off_like" type="button"></button>
    </div>
  </div>
  <div class="card">
    <h2 class="keyhead"><span data-i18n="sec_global">全局按键</span><span class="colhint" data-i18n="sec_switch">开关</span></h2>
    <div class="row">
      <div class="info"><b data-i18n="cmd_toggle">播放 / 暂停（全局）</b></div>
      <span class="gkey" id="g_sc-toggle">—</span>
      <button class="kx" id="off_sc-toggle" type="button"></button>
    </div>
    <div class="row">
      <div class="info"><b data-i18n="cmd_next">下一首（全局）</b></div>
      <span class="gkey" id="g_sc-next">—</span>
      <button class="kx" id="off_sc-next" type="button"></button>
    </div>
    <div class="row">
      <div class="info"><b data-i18n="cmd_prev">上一首（全局）</b></div>
      <span class="gkey" id="g_sc-prev">—</span>
      <button class="kx" id="off_sc-prev" type="button"></button>
    </div>
    <div class="row" style="border-bottom:none;padding-top:14px">
      <div class="info"></div>
      <button class="pv" id="openShortcuts" type="button" data-i18n-title="openShortcuts_t" title="打开 chrome://extensions/shortcuts 修改键位">⌨</button>
    </div>
  </div>
  <div class="card">
    <h2 data-i18n="sec_protect">误触保护</h2>
    <div class="row">
      <div class="info"><b data-i18n="like_confirm">喜欢二次确认</b></div>
      <label class="switch"><input type="checkbox" id="likeConfirm"><span class="track"></span></label>
    </div>
  </div>
  <div class="card">
    <h2 data-i18n="sec_sound">按键音效</h2>
    <div class="row">
      <div class="info"><b data-i18n="snd_keys">快捷键</b></div>
      <label class="switch"><input type="checkbox" id="soundKeys"><span class="track"></span></label>
    </div>
    <div class="row">
      <div class="info"><b data-i18n="snd_ui">UI 按钮</b></div>
      <label class="switch"><input type="checkbox" id="soundUi"><span class="track"></span></label>
    </div>
    <div class="row">
      <div class="info"><b data-i18n="vol">音量</b></div>
      <input type="range" class="vol" id="soundVolume" min="0" max="100" step="5">
      <span class="suffix" id="volVal">20%</span>
    </div>
    <div class="row">
      <div class="info"><b data-i18n="scheme">音效风格</b></div>
      <select class="sel" id="soundScheme">
        <option value="classic" data-i18n="sch_classic">经典</option>
        <option value="deep" data-i18n="sch_deep">低沉</option>
        <option value="crisp" data-i18n="sch_crisp">清脆</option>
        <option value="chip" data-i18n="sch_chip">芯片</option>
        <option value="soft" data-i18n="sch_soft">柔和</option>
        <option value="custom" data-i18n="sch_custom">自定义</option>
      </select>
      <button class="pv" id="audition" type="button" data-i18n-title="audition_title" title="试听当前音效风格">▶</button>
    </div>
    <div id="customBox" style="display:none;padding:2px 0 4px">
      <div class="crow">
        <span class="clab" data-i18n="act_next">下一首</span>
        <button class="pv" id="pv_next" type="button" data-i18n-title="pv_title" title="试听">▶</button>
        <input class="cf" id="cf_next" type="number" min="50" max="4000" step="10">
        <select class="cw" id="cw_next">
          <option value="sine">sine</option>
          <option value="square">square</option>
          <option value="triangle">triangle</option>
          <option value="sawtooth">sawtooth</option>
        </select>
        <span class="suffix">Hz</span>
      </div>
      <div class="crow">
        <span class="clab" data-i18n="act_prev">上一首</span>
        <button class="pv" id="pv_prev" type="button" data-i18n-title="pv_title" title="试听">▶</button>
        <input class="cf" id="cf_prev" type="number" min="50" max="4000" step="10">
        <select class="cw" id="cw_prev">
          <option value="sine">sine</option>
          <option value="square">square</option>
          <option value="triangle">triangle</option>
          <option value="sawtooth">sawtooth</option>
        </select>
        <span class="suffix">Hz</span>
      </div>
      <div class="crow">
        <span class="clab" data-i18n="act_ff">快进</span>
        <button class="pv" id="pv_ff" type="button" data-i18n-title="pv_title" title="试听">▶</button>
        <input class="cf" id="cf_ff" type="number" min="50" max="4000" step="10">
        <select class="cw" id="cw_ff">
          <option value="sine">sine</option>
          <option value="square">square</option>
          <option value="triangle">triangle</option>
          <option value="sawtooth">sawtooth</option>
        </select>
        <span class="suffix">Hz</span>
      </div>
      <div class="crow">
        <span class="clab" data-i18n="act_rw">快退</span>
        <button class="pv" id="pv_rw" type="button" data-i18n-title="pv_title" title="试听">▶</button>
        <input class="cf" id="cf_rw" type="number" min="50" max="4000" step="10">
        <select class="cw" id="cw_rw">
          <option value="sine">sine</option>
          <option value="square">square</option>
          <option value="triangle">triangle</option>
          <option value="sawtooth">sawtooth</option>
        </select>
        <span class="suffix">Hz</span>
      </div>
      <div class="crow">
        <span class="clab" data-i18n="act_like">喜欢</span>
        <button class="pv" id="pv_like" type="button" data-i18n-title="pv_title" title="试听">▶</button>
        <input class="cf" id="cf_like" type="number" min="50" max="4000" step="10">
        <select class="cw" id="cw_like">
          <option value="sine">sine</option>
          <option value="square">square</option>
          <option value="triangle">triangle</option>
          <option value="sawtooth">sawtooth</option>
        </select>
        <span class="suffix">Hz</span>
      </div>
    </div>
  </div>
  </div>
  <div class="col">
  <div class="card">
    <h2 data-i18n="sec_toast">页面内提示样式预览</h2>
    <div class="row">
      <div class="info"><b data-i18n="toast_key">快捷键图标</b></div>
      <label class="switch"><input type="checkbox" id="toastKey"><span class="track"></span></label>
    </div>
    <div class="row">
      <div class="info"><b data-i18n="toast_icon">Emoji 图标</b></div>
      <label class="switch"><input type="checkbox" id="toastIcon"><span class="track"></span></label>
    </div>
    <div class="row">
      <div class="info"><b data-i18n="toast_text">文字</b></div>
      <label class="switch"><input type="checkbox" id="toastText"><span class="track"></span></label>
    </div>
    <div class="row" style="border-bottom:none;padding-bottom:0">
      <div class="info"><b data-i18n="toast_size_label">气泡大小</b></div>
      <input type="range" class="vol" id="toastSize" min="0.5" max="3" step="0.1">
      <span class="suffix" id="toastSizeVal">150%</span>
    </div>
    <div class="row" style="border-bottom:none;padding-bottom:0">
      <div class="info"><b data-i18n="pos_label">提示位置</b></div>
      <select class="sel" id="toastPos">
        <option value="left" data-i18n="pos_left">左</option>
        <option value="center" data-i18n="pos_center">中</option>
        <option value="right" data-i18n="pos_right">右</option>
      </select>
    </div>
    <div class="stage" id="stage" data-i18n-title="stage_hint" title="点击播放一次气泡动画">
      <span class="tag" data-i18n="stage_tag">预览</span>
      <div class="sckit-toast" id="toastDemo">
        <span class="sckit-key" style="display:none">S</span><span class="sckit-icon" style="display:none">⏭</span><span class="sckit-txt" data-i18n="t_toast_next">下一首</span>
      </div>
    </div>
  </div>
  <div class="card">
    <h2 data-i18n="sec_anim">动画</h2>
    <div class="row">
      <div class="info"><b data-i18n="swap_anim">切换音乐动画</b></div>
      <label class="switch"><input type="checkbox" id="swapAnim"><span class="track"></span></label>
    </div>
    <div class="row">
      <div class="info"><b data-i18n="hover_ring">悬停白色描边</b></div>
      <label class="switch"><input type="checkbox" id="hoverRing"><span class="track"></span></label>
    </div>
    <div class="row">
      <div class="info"><b data-i18n="btn_fx">按钮点击动效</b></div>
      <label class="switch"><input type="checkbox" id="btnFx"><span class="track"></span></label>
    </div>
    <div class="row">
      <div class="info"><b data-i18n="tilt_label">倾斜幅度</b></div>
      <input type="range" class="vol" id="tilt" min="0" max="45" step="1">
      <span class="suffix" id="tiltVal">15°</span>
    </div>
  </div>
  <div class="card">
    <h2 data-i18n="sec_style">外观</h2>
    <div class="row">
      <div class="info"><b data-i18n="style_progress">进度条样式</b></div>
      <select class="sel" id="progressStyle">
        <option value="bar" data-i18n="style_bar">圆钮条</option>
        <option value="wave" data-i18n="style_wave">SoundCloud 波形</option>
      </select>
      <div class="sws">
        <button class="sw swwhite" id="progressWhite" type="button" data-i18n-title="col_white" title="白色"></button>
        <button class="sw sworange" id="progressOrange" type="button" data-i18n-title="col_orange" title="橙色"></button>
      </div>
    </div>
    <div class="row">
      <div class="info"><b data-i18n="vol_style">音量样式</b></div>
      <select class="sel" id="volumeStyle">
        <option value="slider" data-i18n="vol_slider">圆钮条</option>
        <option value="white" data-i18n="vol_white">粗框</option>
      </select>
      <div class="sws">
        <button class="sw swwhite" id="volumeWhite" type="button" data-i18n-title="col_white" title="白色"></button>
        <button class="sw sworange" id="volumeOrange" type="button" data-i18n-title="col_orange" title="橙色"></button>
      </div>
    </div>
    <div class="prow">
      <div class="pvbox"><span class="ptag" data-i18n="style_progress">进度条样式</span><div id="pvProg"></div></div>
      <div class="pvbox"><span class="ptag" data-i18n="vol_style">音量样式</span><div id="pvVol"></div></div>
    </div>
  </div>
  </div>
  </div>
  <div class="btnbar">
    <button id="save" type="button" data-i18n="save">保存设置</button>
    <button id="reset" type="button" data-i18n="reset">恢复默认</button>
  </div>
  <script src="defaults.js"></script>
  <script src="i18n.js"></script>
  <script src="sound.js"></script>
  <script src="options.js"></script>
</div>
</body>
</html>
